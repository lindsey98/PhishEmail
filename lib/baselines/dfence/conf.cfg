[env]
model_dir_path = checkpoints/dfence_models
report_dir_path = reports
data_dir_path = data
config_dir_path = config
feature_extraction_batch_size = 1000
train_test_split = 0.3
feature_dir_path = features
bert_global_lookup = 0


urldeep_encoding_mode = embedding
urldeep_truncation_length = 100
urldeep_lstm_units = 512
urldeep_conv1d_filter = 256
urldeep_dense_units = 256
urldeep_epoch = 1
