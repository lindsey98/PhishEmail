[project]
name = "emailenv"
channels = ["conda-forge"]
# CPU build, cross-platform. macOS (Apple Silicon + Intel) and Linux.
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
# Pin Python 3.11: modern wheels exist for every dep here, and it avoids the
# "no numpy>=2 for py3.8" source-build failures seen on old interpreters.
python = "3.11.*"
pip = "*"
setuptools = "*"
wheel = "*"
numpy = "*"
# CPU PyTorch from conda-forge (no CUDA on macOS; CPU on Linux too by default).
pytorch = "*"
requests = "*"
scikit-learn = "*"
spacy = "3.6.1"
beautifulsoup4 = "*"
gensim = "*"
matplotlib = "*"
pandas = "*"
nltk = "*"
tqdm = "*"
unidecode = "*"
pytest = "*"
accelerate = "*"
langdetect = "*"
gdown = "*"
tldextract = "*"
xgboost = "*"
mlxtend = "*"
pdf2image = "*"
faiss-cpu = "*"

[pypi-dependencies]
"flask" = "*"
"flask-cors" = "*"
"imgkit" = "*"
"deep-translator" = "*"
"openai" = "*"
"opencv-python" = "==4.6.0.66"
"opencv-contrib-python" = "==4.6.0.66"
"protobuf" = "==4.25.4"
"transformers" = "==4.46.3"
"playwright" = "*"
"extract-msg" = "*"
"pdfkit" = { git = "https://github.com/akhilnarang/python-pdfkit.git", rev = "add-timeout-option" }

[tasks]
# All tasks run from the project root so the relative ./checkpoints, ./datasets
# and ./lib resource paths resolve correctly.
inference = "python apps/cli/inference.py"
serve = "python apps/server/app.py"
get-model = "bash scripts/get_model.sh"
test = "pytest -q"
# Run once after `pixi install` so Playwright's Chromium is available for the
# HTML → PNG renderer (skip if you only ever run with --fast_text).
install-chromium = "playwright install chromium"

# ---------------------------------------------------------------------------
# Optional features (kept OUT of the default CPU env because they are unused by
# the core pipeline and/or do not ship macOS-arm64 wheels).
# ---------------------------------------------------------------------------

# OCR (PaddleOCR). paddlepaddle has no reliable Apple-Silicon wheel, so it is
# opt-in: the identity check itself does not need it, and CLI inference can skip
# rendering+OCR with --fast_text. Install with `-e ocr` on osx-64 / linux, or on
# Apple Silicon under an x86 (Rosetta) environment.
[tool.pixi.feature.ocr.pypi-dependencies]
paddlepaddle = "*"
paddleocr = "*"

# Adversarial-robustness experiments (lib/adversary). Pulls TensorFlow, which
# has no clean osx-arm64 CPU wheel — install on linux-64 / osx-64.
[tool.pixi.feature.adversary.pypi-dependencies]
openattack = "*"
tensorflow = "*"
tf-keras = "*"

# GPU / CUDA extras (Linux + NVIDIA only). bitsandbytes is 8-bit quantization
# and is not used on CPU.
[tool.pixi.feature.cuda]
system-requirements = { cuda = "12.1" }
[tool.pixi.feature.cuda.dependencies]
bitsandbytes = "*"

[tool.pixi.environments]
# `pixi install`             -> default (CPU core; works on macOS + Linux)
# `pixi install -e ocr`      -> + PaddleOCR (Linux / osx-64; needed by the server)
# `pixi install -e cuda`     -> + bitsandbytes (Linux / NVIDIA)
# `pixi install -e adversary`-> + OpenAttack / TensorFlow (Linux / osx-64)
default = { solve-group = "default" }
ocr = ["ocr"]
cuda = ["cuda"]
adversary = ["adversary"]
