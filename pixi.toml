[project]
name = "emailenv"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.8"
pip = "*"
setuptools = "*"
wheel = "*"
numpy = "*"
requests = "*"
scikit-learn = "*"
spacy = "3.6.1"
beautifulsoup4 = "*"
gensim = "*"
matplotlib = "*"
pandas = "*"
nltk = "*"
tqdm = "*"
unidecode = "*"
pytest = "*"
accelerate = "*"
bitsandbytes = "*"
langdetect = "*"
gdown = "*"
tldextract = "*"
xgboost = "*"
mlxtend = "*"
pdf2image = "*"
faiss-cpu = "*"

[pypi-dependencies]
"flask" = "*"
"flask-cors" = "*"
"imgkit" = "*"
"deep-translator" = "*"
"openattack" = "*"
"opencv-python"= "==4.6.0.66"
"opencv-contrib-python"= "==4.6.0.66"
"protobuf" = "==4.25.4"
"tf-keras" = "*"
"tensorflow-cpu" = "*"
"transformers" = "==4.46.3"
"paddlepaddle" = "*"
"paddleocr"= "*"
"playwright" = "*"
"extract-msg" = "*"
"pdfkit" = { git = "https://github.com/akhilnarang/python-pdfkit.git", rev="add-timeout-option" }

[tasks]
# All tasks run from the project root so the relative ./checkpoints, ./datasets
# and ./lib resource paths resolve correctly.
inference = "python apps/cli/inference.py"
serve = "python apps/server/app.py"
get-model = "bash scripts/get_model.sh"
test = "pytest -q"

[tool.pixi.feature.cuda]
system-requirements = {cuda = "12.1"}

[tool.pixi.environments]
cuda = ["cuda"]