name: Bug report
description: Report a problem with PiMRef
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please do **not** report
        security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full error/traceback if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran and, if possible, a minimal sample email.
      placeholder: |
        1. pixi run inference --email_dir examples/
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU/GPU, Python & pixi versions, and the commit hash you tested.
      placeholder: |
        - OS: Ubuntu 22.04
        - GPU: none / RTX 3090
        - pixi: 0.49.0
        - commit: abc1234
    validations:
      required: true
