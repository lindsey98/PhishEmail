name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The full ML stack (torch, paddleocr, playwright, ...) is heavy and GPU-
      # oriented, so CI installs only the tooling needed for linting and the
      # dependency-light test suite. Tests that need heavy deps skip themselves
      # via pytest.importorskip.
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest beautifulsoup4 tldextract

      - name: Lint (enforced scope)
        run: >
          ruff check apps tests
          lib/config.py lib/labeling
          lib/utilities lib/data lib/reference_db lib/encoder/IdentityBert.py

      - name: Lint (full repo, advisory)
        continue-on-error: true
        run: ruff check .

      - name: Run tests
        run: pytest
