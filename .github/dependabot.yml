version: 2
updates:
  # Keep GitHub Actions pinned versions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The D-Fence baseline ships a pinned requirements.txt.
  - package-ecosystem: "pip"
    directory: "/lib/baselines/dfence"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
